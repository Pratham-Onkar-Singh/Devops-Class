apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard-chart.fullname" . }}
  labels:
    {{- include "taskboard-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "taskboard-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskboard-chart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: page
          configMap:
            name: {{ include "taskboard-chart.fullname" . }}
