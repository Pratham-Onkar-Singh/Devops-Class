name: Final DevOps CI-CD-DevSecOps

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/pratham-onkar-singh/final-devops-taskboard

jobs:
  ci-security:
    name: Build, test, and security gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'Session-21 (Final DevOps Project & Troubleshooting)/application/requirements.txt'

      - name: Install application dependencies
        working-directory: 'Session-21 (Final DevOps Project & Troubleshooting)/application'
        run: python -m pip install -r requirements.txt pytest bandit pip-audit

      - name: Unit tests
        working-directory: 'Session-21 (Final DevOps Project & Troubleshooting)/application'
        run: python -m pytest -v --junitxml=test-results.xml

      - name: SAST with Bandit
        run: bandit -r 'Session-21 (Final DevOps Project & Troubleshooting)/application' -c 'Session-21 (Final DevOps Project & Troubleshooting)/security/.bandit' -f json -o bandit-report.json

      - name: SCA with pip-audit
        working-directory: 'Session-21 (Final DevOps Project & Troubleshooting)/application'
        run: pip-audit -r requirements.txt -f json -o ../security/pip-audit.json

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security and test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: final-project-security-reports
          path: |
            bandit-report.json
            Session-21 (Final DevOps Project & Troubleshooting)/application/test-results.xml
            Session-21 (Final DevOps Project & Troubleshooting)/security/pip-audit.json

  image:
    name: Build, scan, and publish image
    needs: ci-security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for security gate
        uses: docker/build-push-action@v7
        with:
          context: 'Session-21 (Final DevOps Project & Troubleshooting)'
          file: 'Session-21 (Final DevOps Project & Troubleshooting)/docker/Dockerfile'
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          push: false

      - name: Trivy image security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push clean image
        uses: docker/build-push-action@v7
        with:
          context: 'Session-21 (Final DevOps Project & Troubleshooting)'
          file: 'Session-21 (Final DevOps Project & Troubleshooting)/docker/Dockerfile'
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          push: true

  deploy:
    name: Deploy to Kubernetes when configured
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG is not configured; deployment is intentionally skipped."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          kubectl apply -k 'Session-21 (Final DevOps Project & Troubleshooting)/kubernetes'
          kubectl -n final-devops rollout status deployment/taskboard --timeout=180s
