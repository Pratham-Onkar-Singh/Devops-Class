apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-demo
  namespace: session20-observability
  labels:
    app.kubernetes.io/name: monitoring-demo
    app.kubernetes.io/part-of: session20
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring-demo
        app.kubernetes.io/part-of: session20
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: session20-monitoring-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
