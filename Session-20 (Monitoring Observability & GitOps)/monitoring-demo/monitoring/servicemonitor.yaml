apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: monitoring-demo
  namespace: session20-observability
  labels:
    app.kubernetes.io/part-of: session20
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
