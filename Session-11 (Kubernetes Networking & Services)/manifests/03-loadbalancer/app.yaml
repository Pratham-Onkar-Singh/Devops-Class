apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadbalancer-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loadbalancer-web
  template:
    metadata:
      labels:
        app: loadbalancer-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-web
spec:
  type: LoadBalancer
  selector:
    app: loadbalancer-web
  ports:
    - name: http
      port: 80
      targetPort: 80
