apiVersion: v1
kind: Service
metadata:
  name: github-api
spec:
  type: ExternalName
  externalName: api.github.com
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
spec:
  restartPolicy: Never
  containers:
    - name: tools
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
