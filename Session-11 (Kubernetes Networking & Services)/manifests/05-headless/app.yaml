apiVersion: v1
kind: Service
metadata:
  name: headless-web
spec:
  clusterIP: None
  selector:
    app: headless-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-web
spec:
  serviceName: headless-web
  replicas: 2
  selector:
    matchLabels:
      app: headless-web
  template:
    metadata:
      labels:
        app: headless-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: headless-client
spec:
  restartPolicy: Never
  containers:
    - name: tools
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
