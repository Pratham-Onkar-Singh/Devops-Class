apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterip-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clusterip-web
  template:
    metadata:
      labels:
        app: clusterip-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: clusterip-web
spec:
  type: ClusterIP
  selector:
    app: clusterip-web
  ports:
    - name: http
      port: 8080
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: clusterip-client
  labels:
    app: diagnostic-client
spec:
  restartPolicy: Never
  containers:
    - name: tools
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
