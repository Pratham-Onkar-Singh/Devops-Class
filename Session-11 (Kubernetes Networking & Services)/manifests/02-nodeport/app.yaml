apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeport-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodeport-web
  template:
    metadata:
      labels:
        app: nodeport-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nodeport-web
spec:
  type: NodePort
  selector:
    app: nodeport-web
  ports:
    - name: http
      port: 8080
      targetPort: 80
      nodePort: 30080
