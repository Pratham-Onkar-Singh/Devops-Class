apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: volume-practice
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo node-storage > /data/message.txt; sleep 3600"]
      volumeMounts:
        - name: node-data
          mountPath: /data
  volumes:
    - name: node-data
      hostPath:
        path: /tmp/course-volume-demo
        type: DirectoryOrCreate
