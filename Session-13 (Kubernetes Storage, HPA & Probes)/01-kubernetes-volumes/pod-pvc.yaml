apiVersion: v1
kind: Pod
metadata:
  name: dynamic-pvc-demo
  namespace: volume-practice
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo persisted-data > /data/file.txt; sleep 3600"]
      volumeMounts:
        - name: persistent-data
          mountPath: /data
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: dynamic-pvc
