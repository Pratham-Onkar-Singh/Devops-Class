apiVersion: apps/v1
kind: Deployment
metadata:
  name: s14-web
  labels:
    app: s14-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s14-web
  template:
    metadata:
      labels:
        app: s14-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
