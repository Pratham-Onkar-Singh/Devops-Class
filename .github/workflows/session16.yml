name: Session 16 CI/CD Demo

on:
  push:
    branches: [main, master]
    paths:
      - 'Session-16 (Github Actions)/**'
      - '.github/workflows/session16.yml'
  pull_request:
    paths:
      - 'Session-16 (Github Actions)/**'
      - '.github/workflows/session16.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/session-16-ci-cd-demo

jobs:
  ci:
    name: Build and test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Session-16 (Github Actions)/requirements-dev.txt
      - name: Install development dependencies
        working-directory: Session-16 (Github Actions)
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application
        working-directory: Session-16 (Github Actions)
        run: python -m compileall -q app.py
      - name: Run unit tests
        working-directory: Session-16 (Github Actions)
        run: pytest -v --junitxml=test-results.xml
      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session16-test-report
          path: Session-16 (Github Actions)/test-results.xml
          if-no-files-found: ignore

  publish:
    name: Build and publish image (CD)
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: Session-16 (Github Actions)
          file: Session-16 (Github Actions)/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: session16-application
          path: |
            Session-16 (Github Actions)/app.py
            Session-16 (Github Actions)/requirements.txt

  deploy:
    name: Deploy and verify (CD)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Create temporary Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
      - name: Create namespace and registry secret
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create namespace pipeline-demo
          kubectl -n pipeline-demo create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$REGISTRY_TOKEN"
          kubectl -n pipeline-demo patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr"}]}'
      - name: Deploy application
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          kubectl -n pipeline-demo create deployment ci-cd-demo --image="$IMAGE" --port=5000
          kubectl -n pipeline-demo expose deployment ci-cd-demo --name=ci-cd-demo --port=5000
          kubectl -n pipeline-demo rollout status deployment/ci-cd-demo --timeout=180s
      - name: Verify health and calculator response
        run: |
          kubectl -n pipeline-demo port-forward service/ci-cd-demo 5000:5000 > port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/ready && break || sleep 1; done
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS -X POST http://127.0.0.1:5000/api/calculate \
            -H 'Content-Type: application/json' \
            -d '{"a":6,"b":3,"operation":"multiply"}' | tee deployment-result.json
          python -c 'import json; assert json.load(open("deployment-result.json"))["result"] == 18'
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session16-deployment-evidence
          path: |
            deployment-result.json
            port-forward.log
