name: Session 21 Final DevOps Project

on:
  push:
    branches: [main]
    paths:
      - 'Session-21 (Final DevOps Project & Troubleshooting)/**'
      - '.github/workflows/session21-final.yml'
  pull_request:
    paths:
      - 'Session-21 (Final DevOps Project & Troubleshooting)/**'
      - '.github/workflows/session21-final.yml'

permissions:
  contents: read
  packages: write

env:
  PROJECT_DIR: Session-21 (Final DevOps Project & Troubleshooting)
  IMAGE_NAME: ghcr.io/pratham-onkar-singh/final-devops-taskboard

jobs:
  ci-security:
    name: Build, test, and security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'Session-21 (Final DevOps Project & Troubleshooting)/application/requirements.txt'
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: python -m pip install -r requirements.txt pytest bandit pip-audit
      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: python -m pytest -v --junitxml=test-results.xml
      - name: SAST
        run: bandit -r "$PROJECT_DIR/application" -c "$PROJECT_DIR/security/.bandit" -ll -f json -o bandit-report.json
      - name: SCA
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: pip-audit -r requirements.txt -f json -o ../security/pip-audit.json
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: session21-security-reports
          path: |
            bandit-report.json
            ${{ env.PROJECT_DIR }}/application/test-results.xml
            ${{ env.PROJECT_DIR }}/security/pip-audit.json

  image:
    name: Build, scan, and publish image
    needs: ci-security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: Session-21 (Final DevOps Project & Troubleshooting)
          file: Session-21 (Final DevOps Project & Troubleshooting)/docker/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
      - name: Trivy gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: Session-21 (Final DevOps Project & Troubleshooting)
          file: Session-21 (Final DevOps Project & Troubleshooting)/docker/Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          push: true

  deploy:
    name: Deploy to Kubernetes when configured
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy manifest when KUBE_CONFIG is available
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG is not configured; deployment is intentionally skipped."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          kubectl apply -k "$PROJECT_DIR/kubernetes"
          kubectl -n final-devops rollout status deployment/taskboard --timeout=180s
